[package]
name = "pigeon"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Official Rust SDK for the Pigeon email API"
repository = "https://github.com/pigeonfs/pigeon-rust"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
